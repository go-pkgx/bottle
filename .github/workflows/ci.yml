name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test -race -coverprofile=cov.out ./...
      - run: go tool cover -func=cov.out | tail -1

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
        include:
          # The qemu lanes vary the ARCHITECTURE and hold the OS fixed. The BSDs
          # are the other dimension: same amd64, a different kernel and libc.
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64
          - goos: netbsd
            goarch: amd64
          - goos: openbsd
            goarch: amd64
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: ppc64le
          - goos: linux
            goarch: loong64
          # s390x is BIG-ENDIAN, and this package reads binary formats it did
          # not write: ELF and Mach-O headers, OCI manifests, tar and xz
          # streams. Every one of those is little-endian on the wire, so any
          # place that reads an integer through unsafe or through the host's
          # byte order rather than through encoding/binary is wrong there and
          # nowhere else.
          - goos: linux
            goarch: s390x
          # wasm is a real target for this package, not a curiosity: a browser
          # that installs a signed bottle into its own store runs THIS code.
          - goos: js
            goarch: wasm
          - goos: wasip1
            goarch: wasm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # A CGO_ENABLED=0 build must be fully static on every 64-bit target,
      # so pkgm can ship on a `FROM scratch` image for each arch.
      - env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  wasm:
    name: test (js/wasm, node)
    runs-on: ubuntu-latest
    # Building for js/wasm proves the package COMPILES there; it says nothing
    # about whether it WORKS. Go's js/wasm net/http goes through the host's
    # fetch(), its filesystem through the host's fs — two different runtimes
    # from the ones every other lane exercises. So run the suite, in node.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: go test (js/wasm)
        env:
          GOOS: js
          GOARCH: wasm
        run: |
          echo "$(go env GOROOT)/lib/wasm" >> "$GITHUB_PATH"
          PATH="$PATH:$(go env GOROOT)/lib/wasm" go test -count=1 ./...

  emulated:
    name: test (${{ matrix.goarch }}, qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
            qemu: qemu-aarch64-static
          - goarch: riscv64
            qemu: qemu-riscv64-static
          - goarch: ppc64le
            qemu: qemu-ppc64le-static
          - goarch: s390x
            qemu: qemu-s390x-static
          - goarch: loong64
            qemu: qemu-loongarch64-static
    # Cross-COMPILING proves the code builds for an architecture. It says
    # nothing about whether it WORKS there — and the bugs this package can have
    # are exactly the ones a compiler cannot see: a wrong byte order, an
    # unaligned load, an int that is not the width somebody assumed.
    #
    # So run the suite under qemu-user. It is slow and it is the point.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: qemu-user
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static
          # Named, not assumed: a missing emulator would otherwise look like a
          # test failure on the architecture rather than a missing tool.
          command -v ${{ matrix.qemu }} || {
            echo "::error::${{ matrix.qemu }} is not in this image" >&2; exit 1; }
      - name: go test
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.goarch }}
          GOOS: linux
        # -count=1 so a cached PASS from the host architecture cannot stand in
        # for a run that never happened under emulation.
        run: go test -count=1 -exec ${{ matrix.qemu }} ./...

  wasip1:
    name: test (wasip1/wasm, wasmtime)
    runs-on: ubuntu-latest
    # The other wasm lane runs under node, which gives Go's js/wasm port the
    # browser's fetch() and fs. wasip1 is a DIFFERENT port with a different
    # syscall surface — no network at all, and a filesystem only where one is
    # granted. A package that installs bottles has to know which of the two it
    # is on, and the only way to know it does is to run there.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: go test (wasip1/wasm)
        env:
          GOOS: wasip1
          GOARCH: wasm
        run: |
          echo "$(go env GOROOT)/lib/wasm" >> "$GITHUB_PATH"
          PATH="$PATH:$(go env GOROOT)/lib/wasm" go test -count=1 ./...

  freebsd:
    name: test (FreeBSD, a kernel that is not Linux)
    runs-on: ubuntu-latest
    # Cross-compiling proves the code builds for an OS. It says nothing about
    # whether it WORKS there, and the bugs a compiler cannot see are the
    # interesting ones: a path convention, a syscall that behaves differently,
    # an assumption that /proc is mounted.
    #
    # The toolchain never enters the VM — go.mod names a Go version no BSD
    # package set carries, and a lane that installed one would depend on what a
    # package mirror happens to hold that day. Same idiom as the qemu lanes:
    # build here, run there, the VM supplying only a kernel and a libc.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: cross-compile the test binaries
        run: .github/scripts/bsd-tests.sh build freebsd
      # Pinned by commit, not by tag: a tag can be moved onto code we never read.
      - uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1
        with:
          usesh: true
          run: .github/scripts/bsd-tests.sh run

  netbsd:
    name: test (NetBSD, a kernel that is not Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: cross-compile the test binaries
        run: .github/scripts/bsd-tests.sh build netbsd
      - uses: vmactions/netbsd-vm@7f23a491dcc69c34195721ab67934917707f84c7
        with:
          usesh: true
          run: .github/scripts/bsd-tests.sh run

  openbsd:
    name: test (OpenBSD, the strictest kernel we can reach)
    runs-on: ubuntu-latest
    # OpenBSD is the one most likely to find something: W^X is enforced, malloc
    # is deliberately hostile (junk-filling, guard pages), and syscall origin is
    # policed. Code that merely happens to work elsewhere tends to stop here.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: cross-compile the test binaries
        run: .github/scripts/bsd-tests.sh build openbsd
      - uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530
        with:
          usesh: true
          run: .github/scripts/bsd-tests.sh run
